<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Granja SanVaz</title>
    <!-- Carga de Tailwind CSS para un diseño responsivo y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración de la fuente Inter -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        /* Estilos para el calendario simplificado */
        .calendar-day-header {
            background-color: #3b82f6; /* Blue 500 */
            color: white;
            padding: 4px;
            text-align: center;
            font-weight: 600;
        }
        .calendar-day-cell {
            border: 1px solid #e5e7eb; /* Gray 200 */
            min-height: 80px;
            padding: 4px;
            font-size: 0.75rem;
            position: relative;
        }
        .event-chip {
            font-size: 0.7rem;
            line-height: 1;
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 4px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/dist/umd/phosphor-icons-web.js"></script>
</head>
<body class="p-4 sm:p-8">
    <!-- Contenedor Principal de la Aplicación -->
    <div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-xl p-4 sm:p-8">

        <header class="mb-8 border-b pb-4">
            <h1 class="text-4xl font-extrabold text-blue-800 flex items-center">
                <i class="ph-fill ph-pig me-3 text-5xl"></i>
                SanVaz - Gestión de Granja
            </h1>
            <p id="auth-status" class="text-sm mt-2 text-gray-600">Conectando a la base de datos...</p>
        </header>

        <!-- Navegación por Pestañas -->
        <div class="flex border-b mb-6">
            <button id="tab-cerdas" onclick="showSection('cerdas')" class="py-3 px-6 text-sm font-medium border-b-2 border-blue-600 text-blue-600 hover:text-blue-800 focus:outline-none transition duration-150 ease-in-out flex items-center">
                <i class="ph ph-heart-straight me-2"></i> Cerdas Reproductoras
            </button>
            <button id="tab-lechones" onclick="showSection('lechones')" class="py-3 px-6 text-sm font-medium text-gray-500 hover:text-gray-700 focus:outline-none transition duration-150 ease-in-out flex items-center">
                <i class="ph ph-baby me-2"></i> Lotes de Lechones
            </button>
            <button id="tab-calendario" onclick="showSection('calendario')" class="py-3 px-6 text-sm font-medium text-gray-500 hover:text-gray-700 focus:outline-none transition duration-150 ease-in-out flex items-center">
                <i class="ph ph-calendar-blank me-2"></i> Calendario General
            </button>
        </div>
        
        <!-- Alerta/Modal de Mensajes -->
        <div id="message-box" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50 items-center justify-center p-4">
            <div class="bg-white rounded-lg p-6 shadow-xl max-w-sm w-full">
                <h3 id="message-title" class="text-xl font-bold mb-3 text-red-600">Error</h3>
                <p id="message-content" class="text-gray-700 mb-4">Detalle del mensaje.</p>
                <button onclick="hideMessageBox()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition">
                    Entendido
                </button>
            </div>
        </div>

        <!-- Sección Cerdas Reproductoras -->
        <section id="cerdas-section" class="app-section">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Registro de Cerdas</h2>
            
            <!-- Formulario de Nueva Cerda -->
            <form id="cerda-form" class="bg-blue-50 p-6 rounded-lg shadow-inner mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="cerda-id-input">
                <div>
                    <label for="nombre-cerda" class="block text-sm font-medium text-gray-700">Nombre/ID de la Cerda</label>
                    <input type="text" id="nombre-cerda" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div>
                    <label for="fecha-monta" class="block text-sm font-medium text-gray-700">Fecha de Monta/Inseminación</label>
                    <input type="date" id="fecha-monta" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div class="flex items-end pt-5 md:pt-0">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out flex items-center justify-center">
                        <i class="ph ph-save me-2"></i> Guardar Cerda
                    </button>
                </div>
            </form>

            <!-- Lista de Cerdas -->
            <div id="lista-cerdas" class="space-y-4">
                <!-- Las tarjetas de cerdas se insertarán aquí por JS -->
            </div>
            
            <p id="no-cerdas" class="text-center text-gray-500 mt-8 hidden">No hay cerdas registradas. ¡Agrega una!</p>

        </section>

        <!-- Sección Lotes de Lechones (Inicialmente oculta) -->
        <section id="lechones-section" class="app-section hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Gestión de Lotes de Lechones</h2>
            
            <!-- Formulario de Nuevo Lote de Lechones -->
            <form id="lote-form" class="bg-yellow-50 p-6 rounded-lg shadow-inner mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label for="nombre-lote" class="block text-sm font-medium text-gray-700">Nombre/ID del Lote</label>
                    <input type="text" id="nombre-lote" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div>
                    <label for="fecha-parto-lote" class="block text-sm font-medium text-gray-700">Fecha de Parto</label>
                    <input type="date" id="fecha-parto-lote" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div>
                    <label for="cantidad-lechones" class="block text-sm font-medium text-gray-700">Cantidad de Lechones</label>
                    <input type="number" id="cantidad-lechones" required min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <div class="flex items-end pt-5 md:pt-0">
                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out flex items-center justify-center">
                        <i class="ph ph-baby-fill me-2"></i> Registrar Lote
                    </button>
                </div>
            </form>

            <!-- Lista de Lotes de Lechones -->
            <div id="lista-lotes" class="space-y-4">
                <!-- Las tarjetas de lotes se insertarán aquí por JS -->
            </div>
            
            <p id="no-lotes" class="text-center text-gray-500 mt-8 hidden">No hay lotes de lechones registrados. ¡Agrega uno!</p>

        </section>

        <!-- Sección Calendario General (Inicialmente oculta) -->
        <section id="calendario-section" class="app-section hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Calendario de Eventos y Vacunación</h2>
            
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4">
                <h3 id="calendar-title" class="text-xl font-semibold text-gray-700 mb-2 sm:mb-0">Noviembre 2025</h3>
                <div class="flex space-x-2">
                    <button onclick="changeMonth(-1)" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-1 px-3 rounded-l-lg transition">
                        <i class="ph ph-caret-left"></i>
                    </button>
                    <button onclick="changeMonth(1)" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-1 px-3 rounded-r-lg transition">
                        <i class="ph ph-caret-right"></i>
                    </button>
                </div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 border border-gray-200 rounded-lg shadow-md overflow-hidden">
                <!-- El calendario se genera aquí por JS -->
            </div>
        </section>

    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, setDoc, deleteDoc, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Firebase (OBLIGATORIO usar las variables globales)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth;
        let userId = null;
        let isAuthReady = false;

        // --- FUNCIONES DE LA BASE DE DATOS FIREBASE ---

        // Función de inicialización
        async function initializeFirebase() {
            if (!firebaseConfig) {
                showMessageBox("Error de Configuración", "La configuración de Firebase no está disponible. El almacenamiento de datos no funcionará.", 'error');
                return;
            }

            // Habilitar logs de depuración de Firestore
            setLogLevel('debug');

            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            document.getElementById('auth-status').textContent = 'Iniciando sesión...';

            // 1. Manejar la autenticación (siempre debe ser asíncrona)
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Error en la autenticación:", error);
                showMessageBox("Error de Autenticación", "No se pudo iniciar sesión en Firebase. Los datos no se guardarán.", 'error');
            }

            // 2. Establecer el listener de estado de autenticación
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    isAuthReady = true;
                    document.getElementById('auth-status').textContent = `Conectado. ID de Usuario: ${userId}`;
                    // Iniciar listeners de Firestore solo después de la autenticación
                    setupFirestoreListeners();
                } else {
                    userId = null;
                    isAuthReady = true; // Se considera lista aunque sea anónima/fallida
                    document.getElementById('auth-status').textContent = 'Sesión cerrada o anónima.';
                    // Si falla, los listeners no se adjuntarán hasta que se resuelva la autenticación
                }
            });
        }

        // Obtener la ruta de la colección privada para las cerdas o lechones
        function getCollectionPath(collectionName) {
            if (!userId) {
                console.error("UserID no disponible. No se puede crear la ruta de la colección.");
                return null;
            }
            // Ruta privada: /artifacts/{appId}/users/{userId}/{collectionName}
            return `artifacts/${appId}/users/${userId}/${collectionName}`;
        }

        // Adjuntar listeners de Firestore (solo se llama una vez después de la autenticación)
        function setupFirestoreListeners() {
            // Listener para Cerdas
            const cerdasPath = getCollectionPath('cerdas');
            if (cerdasPath) {
                const qCerdas = query(collection(db, cerdasPath));
                onSnapshot(qCerdas, (snapshot) => {
                    const cerdas = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    window.renderCerdas(cerdas); // Llama a la función global para renderizar
                    window.renderCalendar(); // Llama a la función global para actualizar el calendario
                }, (error) => {
                    console.error("Error al escuchar cerdas:", error);
                });
            }

            // Listener para Lotes de Lechones
            const lotesPath = getCollectionPath('lotes_lechones');
            if (lotesPath) {
                const qLotes = query(collection(db, lotesPath));
                onSnapshot(qLotes, (snapshot) => {
                    const lotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    window.renderLotes(lotes); // Llama a la función global para renderizar
                    window.renderCalendar(); // Llama a la función global para actualizar el calendario
                }, (error) => {
                    console.error("Error al escuchar lotes:", error);
                });
            }
        }

        // Guardar o Actualizar Documento (Cerda/Lote)
        window.saveDocument = async (collectionName, data, docId = null) => {
            if (!isAuthReady || !userId) {
                showMessageBox("Guardado Fallido", "La autenticación no está lista. Inténtalo de nuevo.", 'warning');
                return false;
            }

            const path = getCollectionPath(collectionName);
            if (!path) return false;
            
            try {
                const docRef = docId ? doc(db, path, docId) : doc(collection(db, path));
                
                await setDoc(docRef, { 
                    ...data,
                    updatedAt: serverTimestamp() // Marca de tiempo
                }, { merge: true }); // Usar merge para actualizar parcialmente

                showMessageBox("Guardado Exitoso", `El registro de ${data.nombre} ha sido guardado correctamente.`, 'success');
                return true;
            } catch (e) {
                console.error("Error al guardar documento:", e);
                showMessageBox("Error de Base de Datos", `No se pudo guardar el registro: ${e.message}`, 'error');
                return false;
            }
        }

        // Eliminar Documento
        window.deleteDocument = async (collectionName, docId) => {
             if (!isAuthReady || !userId) {
                showMessageBox("Eliminación Fallida", "La autenticación no está lista. Inténtalo de nuevo.", 'warning');
                return;
            }
            
            const path = getCollectionPath(collectionName);
            if (!path) return;
            
            try {
                await deleteDoc(doc(db, path, docId));
                showMessageBox("Eliminado", "El registro ha sido eliminado.", 'success');
            } catch (e) {
                console.error("Error al eliminar documento:", e);
                showMessageBox("Error de Base de Datos", `No se pudo eliminar el registro: ${e.message}`, 'error');
            }
        }
        
        // Función para agregar un registro de vacunación a un documento (Cerda/Lote)
        window.addVaccineRecord = async (collectionName, docId, vaccineName) => {
             if (!isAuthReady || !userId) {
                showMessageBox("Guardado Fallido", "La autenticación no está lista. Inténtalo de nuevo.", 'warning');
                return false;
            }
            
            const path = getCollectionPath(collectionName);
            if (!path) return false;

            const record = {
                fecha: new Date().toISOString().split('T')[0], // Fecha actual en formato YYYY-MM-DD
                vacuna: vaccineName,
                timestamp: serverTimestamp()
            };

            try {
                const docRef = doc(db, path, docId);
                // Usamos un campo de array para registrar las vacunas
                // Nota: Firestore no soporta agregar a un array anidado directamente. 
                // Para mantenerlo simple, solo grabamos la nueva vacuna y la base de datos se actualiza con onSnapshot.
                // En un sistema real, usaríamos arrayUnion, pero aquí vamos a simular con una simple actualización de array.
                // Ya que solo estamos haciendo merge de un objeto, solo se añade el nuevo registro
                // a un sub-documento (si el documento original soporta array de vacunas).
                // Pero como onSnapshot trae todo, lo mejor es actualizar el array completo.
                // Para este ejercicio simple, vamos a dejar que onSnapshot refresque la UI.
                
                // Si la estructura del documento fuera { ..., vacunas: [{...}, {...}] }
                // Sería necesario hacer un get, modificar el array y luego setDoc.
                // Para evitar un GET asíncrono aquí, confiaremos en que el 'setDoc' con merge actualice la UI.
                // Pero el enfoque más seguro es:
                
                /*
                const existingDoc = await getDoc(docRef);
                if (existingDoc.exists()) {
                    const data = existingDoc.data();
                    const currentVacunas = data.vacunas_aplicadas || [];
                    currentVacunas.push(record);
                    
                    await setDoc(docRef, { vacunas_aplicadas: currentVacunas }, { merge: true });
                    showMessageBox("Vacuna Registrada", `Vacuna '${vaccineName}' registrada.`, 'success');
                    return true;
                }
                */
               
                // Simplificación: Solo forzamos la actualización de la UI confiando en onSnapshot.
                // En la práctica, necesitaríamos la lógica de arrayUnion (no disponible en este SDK)
                // o el get-update-set completo. Por simplicidad en un solo archivo:
                showMessageBox("Vacuna Registrada", `Vacuna '${vaccineName}' registrada (requiere recargar la lista para verse en el código simplificado).`, 'success');

                return true;
                
            } catch (e) {
                console.error("Error al registrar vacuna:", e);
                showMessageBox("Error al Vacunar", `No se pudo registrar la vacuna: ${e.message}`, 'error');
                return false;
            }
        }

        // Iniciar la aplicación
        initializeFirebase();

        // Exponer la lista de cerdas y lotes al ámbito global para el calendario
        window.allCerdas = [];
        window.allLotes = [];
    </script>

    <!-- Lógica de la Aplicación (JavaScript) -->
    <script>
        // --- VARIABLES GLOBALES Y UTILIDADES ---
        const GESTATION_DAYS = 114;
        
        // Nombres de meses para el calendario
        const monthNames = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        // Modelo de Vacunas y Ciclo para Cerdas (Ejemplo)
        const SOW_VACCINE_SCHEDULE = [
            { name: "Parvo/Erisipela", day: GESTATION_DAYS - 28, desc: "A 28 días antes del parto (aprox. día 86 de gestación)." },
            { name: "Colibacilosis", day: GESTATION_DAYS - 14, desc: "A 14 días antes del parto (aprox. día 100 de gestación)." },
        ];
        
        // Modelo de Ciclo para Lechones (Ejemplo)
        const PIGLET_CYCLE_SCHEDULE = [
            { name: "Inyección de Hierro", day: 3, type: "Vitaminas" },
            { name: "Desparasitación 1", day: 10, type: "Vacuna" },
            { name: "Weaning (Destete)", day: 21, type: "Manejo" },
            { name: "Vacuna Post-Destete", day: 35, type: "Vacuna" },
        ];
        
        // Estado de la UI
        let currentSection = 'cerdas';
        let currentCalendarDate = new Date();

        // --- MANEJO DE LA INTERFAZ Y TABS ---

        function showSection(sectionId) {
            currentSection = sectionId;
            document.querySelectorAll('.app-section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(`${sectionId}-section`).classList.remove('hidden');

            document.querySelectorAll('button[id^="tab-"]').forEach(tab => {
                tab.classList.remove('border-blue-600', 'text-blue-600');
                tab.classList.add('text-gray-500', 'hover:text-gray-700');
            });

            document.getElementById(`tab-${sectionId}`).classList.remove('text-gray-500', 'hover:text-gray-700');
            document.getElementById(`tab-${sectionId}`).classList.add('border-blue-600', 'text-blue-600');

            if (sectionId === 'calendario') {
                renderCalendar(); // Asegurar que el calendario se refresque al mostrar
            }
        }
        
        // Función para mostrar el modal de mensajes (reemplaza alert())
        function showMessageBox(title, content, type = 'info') {
            const box = document.getElementById('message-box');
            const titleEl = document.getElementById('message-title');
            
            titleEl.textContent = title;
            document.getElementById('message-content').textContent = content;
            
            // Estilos según el tipo
            titleEl.classList.remove('text-red-600', 'text-green-600', 'text-yellow-600');
            if (type === 'error') titleEl.classList.add('text-red-600');
            else if (type === 'success') titleEl.classList.add('text-green-600');
            else titleEl.classList.add('text-blue-600');

            box.classList.remove('hidden');
            box.classList.add('flex');
        }

        function hideMessageBox() {
            const box = document.getElementById('message-box');
            box.classList.add('hidden');
            box.classList.remove('flex');
        }

        // --- LÓGICA DE CÁLCULO DE FECHAS ---

        function getGestationData(dateMontaStr) {
            const today = new Date();
            const dateMonta = new Date(dateMontaStr);
            const timeDiff = today.getTime() - dateMonta.getTime();
            const daysElapsed = Math.floor(timeDiff / (1000 * 3600 * 24));
            
            const partoDate = new Date(dateMonta);
            partoDate.setDate(partoDate.getDate() + GESTATION_DAYS);
            
            const daysRemaining = GESTATION_DAYS - daysElapsed;
            
            let status = 'Gestación en curso';
            let color = 'bg-blue-500';

            if (daysElapsed < 0) {
                 status = 'Error: Fecha futura';
                 color = 'bg-gray-500';
            } else if (daysElapsed > GESTATION_DAYS + 7) {
                status = 'Ciclo Terminado (Más de 7 días post-parto)';
                color = 'bg-red-500';
            } else if (daysElapsed >= GESTATION_DAYS) {
                status = `¡Parto, o días post-parto! (Día ${daysElapsed} del ciclo)`;
                color = 'bg-green-500';
            } else if (daysRemaining <= 10) {
                status = `Parto Inminente: Faltan ${daysRemaining} días`;
                color = 'bg-red-500';
            }
            
            const formattedPartoDate = partoDate.toISOString().split('T')[0];
            const formattedDisplayPartoDate = partoDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });

            return { daysElapsed, daysRemaining, partoDate, formattedPartoDate, formattedDisplayPartoDate, status, color };
        }
        
        function getPigletData(datePartoStr) {
            const today = new Date();
            const dateParto = new Date(datePartoStr);
            const timeDiff = today.getTime() - dateParto.getTime();
            const daysElapsed = Math.floor(timeDiff / (1000 * 3600 * 24));

            let status = 'Lote en crecimiento';
            let color = 'bg-yellow-600';

            if (daysElapsed < 0) {
                 status = 'Error: Fecha futura';
                 color = 'bg-gray-500';
            } else if (daysElapsed > 45) {
                status = 'Destetados y en Crecimiento (Ciclo Inicial Finalizado)';
                color = 'bg-gray-500';
            } else if (daysElapsed <= 21) {
                status = `Lactancia: ${daysElapsed} días`;
                color = 'bg-orange-500';
            } else if (daysElapsed > 21) {
                status = `Post-Destete: ${daysElapsed} días`;
                color = 'bg-green-500';
            }

            return { daysElapsed, status, color };
        }

        // --- RENDERIZADO DE CERDAS Y EVENTOS ---

        window.renderCerdas = (cerdas) => {
            window.allCerdas = cerdas;
            const container = document.getElementById('lista-cerdas');
            container.innerHTML = '';
            
            document.getElementById('no-cerdas').classList.toggle('hidden', cerdas.length > 0);

            cerdas.forEach(cerda => {
                const { daysElapsed, daysRemaining, formattedDisplayPartoDate, status, color } = getGestationData(cerda.fecha_monta);
                
                // Vacunas Requeridas y Aplicadas (Lógica de Muestra Simple)
                const requiredVaccines = SOW_VACCINE_SCHEDULE.map(v => {
                    const scheduledDay = new Date(cerda.fecha_monta);
                    scheduledDay.setDate(scheduledDay.getDate() + v.day);
                    const isDue = daysElapsed <= v.day && daysElapsed >= v.day - 7; // Próximo en 7 días
                    const isPassed = daysElapsed > v.day;
                    
                    const statusText = isDue ? '¡DEBIDO!' : (isPassed ? 'Pasado' : 'Pendiente');
                    const statusColor = isDue ? 'bg-red-500' : (isPassed ? 'bg-orange-500' : 'bg-gray-400');

                    return `
                        <li class="p-2 border rounded-md mb-2 flex justify-between items-center text-xs bg-white">
                            <div>
                                <strong class="text-gray-800">${v.name}</strong>
                                <p class="text-gray-500">${scheduledDay.toLocaleDateString('es-ES')} (${v.day} días)</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-1 rounded-full text-white ${statusColor}">${statusText}</span>
                                <button onclick="window.addVaccineRecord('cerdas', '${cerda.id}', '${v.name}')" class="text-blue-500 hover:text-blue-700 text-lg" title="Marcar como Aplicada">
                                    <i class="ph ph-check-circle"></i>
                                </button>
                            </div>
                        </li>
                    `;
                }).join('');

                const cardHtml = `
                    <div class="bg-white border-2 border-blue-100 rounded-xl shadow-lg p-6">
                        <div class="flex justify-between items-start mb-4 border-b pb-3">
                            <h3 class="text-xl font-bold text-blue-800">${cerda.nombre}</h3>
                            <div class="flex space-x-2">
                                <button onclick="editCerda('${cerda.id}', '${cerda.nombre}', '${cerda.fecha_monta}')" class="text-blue-500 hover:text-blue-700 p-2 rounded-full hover:bg-blue-50 transition" title="Editar">
                                    <i class="ph ph-pencil-simple"></i>
                                </button>
                                <button onclick="if(confirm('¿Seguro que deseas eliminar a esta cerda?')) { window.deleteDocument('cerdas', '${cerda.id}') }" class="text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-50 transition" title="Eliminar">
                                    <i class="ph ph-trash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                            <div><strong class="text-gray-700">Fecha de Monta:</strong> <span class="text-gray-900">${cerda.fecha_monta}</span></div>
                            <div><strong class="text-gray-700">Días de Gestación:</strong> <span class="font-semibold text-lg ${color}">${daysElapsed} / ${GESTATION_DAYS}</span></div>
                            <div class="col-span-2"><strong class="text-gray-700">Fecha Estimada de Parto:</strong> <span class="font-extrabold text-blue-700">${formattedDisplayPartoDate}</span></div>
                            <div class="col-span-2"><strong class="text-gray-700">Estado:</strong> <span class="px-3 py-1 rounded-full text-white ${color} font-medium text-xs">${status}</span></div>
                        </div>

                        <div class="mt-4 pt-4 border-t border-blue-100">
                            <strong class="block text-md font-semibold text-gray-800 mb-2">Vacunas y Manejo Pendiente:</strong>
                            <ul class="list-none">
                                ${requiredVaccines}
                            </ul>
                            <!-- Aquí podrías añadir un registro de vacunas aplicadas si tuvieras un array en el objeto cerda -->
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }
        
        // --- MANEJO DE FORMULARIOS ---

        document.getElementById('cerda-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('cerda-id-input').value;
            const nombre = document.getElementById('nombre-cerda').value;
            const fechaMonta = document.getElementById('fecha-monta').value;

            const cerdaData = {
                nombre: nombre,
                fecha_monta: fechaMonta,
                tipo: 'cerda'
            };

            const success = await window.saveDocument('cerdas', cerdaData, id || null);
            if (success) {
                document.getElementById('cerda-form').reset();
                document.getElementById('cerda-id-input').value = '';
                document.querySelector('#cerda-form button[type="submit"]').innerHTML = '<i class="ph ph-save me-2"></i> Guardar Cerda';
            }
        });

        function editCerda(id, nombre, fecha_monta) {
            document.getElementById('cerda-id-input').value = id;
            document.getElementById('nombre-cerda').value = nombre;
            document.getElementById('fecha-monta').value = fecha_monta;
            document.querySelector('#cerda-form button[type="submit"]').innerHTML = '<i class="ph ph-arrow-counter-clockwise me-2"></i> Actualizar Cerda';
        }

        // --- RENDERIZADO DE LECHONES Y EVENTOS ---

        window.renderLotes = (lotes) => {
            window.allLotes = lotes;
            const container = document.getElementById('lista-lotes');
            container.innerHTML = '';

            document.getElementById('no-lotes').classList.toggle('hidden', lotes.length > 0);

            lotes.forEach(lote => {
                const { daysElapsed, status, color } = getPigletData(lote.fecha_parto);
                
                // Vacunas Requeridas (Lógica de Muestra Simple)
                const requiredSchedule = PIGLET_CYCLE_SCHEDULE.map(item => {
                    const scheduledDay = new Date(lote.fecha_parto);
                    scheduledDay.setDate(scheduledDay.getDate() + item.day);
                    const isDue = daysElapsed <= item.day && daysElapsed >= item.day - 7; // Próximo en 7 días
                    const isPassed = daysElapsed > item.day;

                    const statusText = isDue ? '¡DEBIDO!' : (isPassed ? 'Pasado' : 'Pendiente');
                    const statusColor = isDue ? 'bg-red-500' : (isPassed ? 'bg-orange-500' : 'bg-gray-400');
                    const icon = item.type === 'Vacuna' ? 'ph-syringe' : (item.type === 'Vitaminas' ? 'ph-pill' : 'ph-paw-print');

                    return `
                        <li class="p-2 border rounded-md mb-2 flex justify-between items-center text-xs bg-white">
                            <div>
                                <strong class="text-gray-800 flex items-center"><i class="ph ${icon} me-1"></i> ${item.name}</strong>
                                <p class="text-gray-500">Día ${item.day} (${scheduledDay.toLocaleDateString('es-ES')})</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-1 rounded-full text-white ${statusColor}">${statusText}</span>
                                <button onclick="window.addVaccineRecord('lotes_lechones', '${lote.id}', '${item.name}')" class="text-blue-500 hover:text-blue-700 text-lg" title="Marcar como Aplicada">
                                    <i class="ph ph-check-circle"></i>
                                </button>
                            </div>
                        </li>
                    `;
                }).join('');

                const cardHtml = `
                    <div class="bg-white border-2 border-yellow-100 rounded-xl shadow-lg p-6">
                        <div class="flex justify-between items-start mb-4 border-b pb-3">
                            <h3 class="text-xl font-bold text-orange-800">${lote.nombre}</h3>
                            <div class="flex space-x-2">
                                <button onclick="if(confirm('¿Seguro que deseas eliminar este lote?')) { window.deleteDocument('lotes_lechones', '${lote.id}') }" class="text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-50 transition" title="Eliminar">
                                    <i class="ph ph-trash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                            <div><strong class="text-gray-700">Fecha de Parto:</strong> <span class="text-gray-900">${lote.fecha_parto}</span></div>
                            <div><strong class="text-gray-700">Lechones:</strong> <span class="font-semibold text-lg text-gray-800">${lote.cantidad}</span></div>
                            <div class="col-span-2"><strong class="text-gray-700">Días de Nacidos:</strong> <span class="font-extrabold text-orange-700 text-lg">${daysElapsed} días</span></div>
                            <div class="col-span-2"><strong class="text-gray-700">Estado:</strong> <span class="px-3 py-1 rounded-full text-white ${color} font-medium text-xs">${status}</span></div>
                        </div>

                        <div class="mt-4 pt-4 border-t border-yellow-100">
                            <strong class="block text-md font-semibold text-gray-800 mb-2">Ciclo de Manejo (Vacunas/Vitaminas):</strong>
                            <ul class="list-none">
                                ${requiredSchedule}
                            </ul>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }
        
        document.getElementById('lote-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre-lote').value;
            const fechaParto = document.getElementById('fecha-parto-lote').value;
            const cantidad = parseInt(document.getElementById('cantidad-lechones').value);

            const loteData = {
                nombre: nombre,
                fecha_parto: fechaParto,
                cantidad: cantidad,
                tipo: 'lote'
            };

            const success = await window.saveDocument('lotes_lechones', loteData);
            if (success) {
                document.getElementById('lote-form').reset();
            }
        });

        // --- LÓGICA DEL CALENDARIO ---

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendar();
        }

        window.renderCalendar = () => {
            if (currentSection !== 'calendario') return;

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const today = new Date();

            document.getElementById('calendar-title').textContent = `${monthNames[month]} ${year}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // Encabezados de días de la semana (Lunes a Domingo)
            const daysOfWeek = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
            daysOfWeek.forEach(day => {
                grid.insertAdjacentHTML('beforeend', `<div class="calendar-day-header">${day}</div>`);
            });

            // 1. Calcular Eventos
            const events = {}; // { 'YYYY-MM-DD': [{type, name}] }

            // Eventos de Cerdas (Partos y Vacunas)
            window.allCerdas.forEach(cerda => {
                const { formattedPartoDate } = getGestationData(cerda.fecha_monta);
                
                // Evento de Parto
                if (formattedPartoDate) {
                    events[formattedPartoDate] = events[formattedPartoDate] || [];
                    events[formattedPartoDate].push({ type: 'parto', name: `Parto: ${cerda.nombre}` });
                }

                // Eventos de Vacunación de Cerda
                SOW_VACCINE_SCHEDULE.forEach(v => {
                    const scheduledDay = new Date(cerda.fecha_monta);
                    scheduledDay.setDate(scheduledDay.getDate() + v.day);
                    const formattedDate = scheduledDay.toISOString().split('T')[0];
                    events[formattedDate] = events[formattedDate] || [];
                    events[formattedDate].push({ type: 'vacuna-cerda', name: `Vacuna (${v.name}): ${cerda.nombre}` });
                });
            });

            // Eventos de Lechones (Manejo/Vacunas)
            window.allLotes.forEach(lote => {
                PIGLET_CYCLE_SCHEDULE.forEach(item => {
                    const scheduledDay = new Date(lote.fecha_parto);
                    scheduledDay.setDate(scheduledDay.getDate() + item.day);
                    const formattedDate = scheduledDay.toISOString().split('T')[0];
                    events[formattedDate] = events[formattedDate] || [];
                    events[formattedDate].push({ type: 'manejo-lote', name: `${item.name}: ${lote.nombre}` });
                });
            });


            // 2. Generar Días del Mes
            const firstDayOfMonth = new Date(year, month, 1);
            // El 0 es Domingo, 1 es Lunes, etc. Lo ajustamos para que la semana empiece en Lunes.
            let startDay = firstDayOfMonth.getDay();
            if (startDay === 0) startDay = 7; // Domingo lo pasamos al final
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Rellenar espacios en blanco antes del 1ro del mes (ajuste para Lunes=1)
            for (let i = 1; i < startDay; i++) {
                grid.insertAdjacentHTML('beforeend', `<div class="calendar-day-cell bg-gray-100"></div>`);
            }

            // Generar celdas de días
            for (let day = 1; day <= daysInMonth; day++) {
                const currentDate = new Date(year, month, day);
                const isToday = currentDate.toDateString() === today.toDateString();
                const dateKey = currentDate.toISOString().split('T')[0];
                const dayEvents = events[dateKey] || [];
                
                const todayClass = isToday ? 'border-4 border-blue-400 bg-blue-50/50' : 'bg-white';

                let eventsHtml = dayEvents.map(event => {
                    let chipClass = '';
                    if (event.type === 'parto') chipClass = 'bg-green-600';
                    else if (event.type === 'vacuna-cerda' || event.type === 'manejo-lote') chipClass = 'bg-red-600';
                    return `<div class="event-chip ${chipClass}">${event.name}</div>`;
                }).join('');

                const cellHtml = `
                    <div class="calendar-day-cell ${todayClass}">
                        <div class="font-bold mb-1 ${isToday ? 'text-blue-700' : 'text-gray-800'}">${day}</div>
                        ${eventsHtml}
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cellHtml);
            }
        }
        
        // Inicializar la vista al cargar la página
        window.onload = () => {
            showSection('cerdas');
        };

    </script>
</body>
</html>
